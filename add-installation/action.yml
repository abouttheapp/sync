name: Add installation to AboutTheApp
description: Record an installation of an existing product version in AboutTheApp.
author: AboutTheApp

inputs:
  token:
    description: AboutTheApp CI/CD token. Store it as a GitHub Actions secret.
    required: true
  alias:
    description: Product alias in AboutTheApp.
    required: true
  customer-alias:
    description: Customer alias in AboutTheApp.
    required: true
  environment:
    description: Installation environment, for example production or staging.
    required: true
  version:
    description: Existing product version to record as installed.
    required: true
  url:
    description: URL of the installation.
    required: false
    default: ""
  location:
    description: Free-text installation location, for example EU-West Frankfurt.
    required: false
    default: ""
  visibility:
    description: Installation visibility. Supported values are public and private. Empty inherits the previous installation.
    required: false
    default: ""
  is-primary:
    description: Whether this is the primary installation. Supported values are true and false. Empty inherits the previous installation.
    required: false
    default: ""
  verify-url:
    description: URL where the deployed app reports its version. When set, the action waits until the app reports the version and records nothing if it does not.
    required: false
    default: ""
  verify-field:
    description: jq path to the version in a JSON response from verify-url. A non-JSON response is compared by its first line.
    required: false
    default: .version
  verify-timeout:
    description: Seconds to wait for verify-url to report the version.
    required: false
    default: "300"
  verify-interval:
    description: Seconds between checks of verify-url.
    required: false
    default: "10"
  api-base:
    description: AboutTheApp API base URL.
    required: false
    default: https://aboutthe.app/api/v1

outputs:
  installation-id:
    description: Identifier of the recorded installation.
    value: ${{ steps.installation.outputs.id }}

runs:
  using: composite
  steps:
    - name: Verify deployed version
      if: ${{ inputs.verify-url != '' }}
      shell: bash
      env:
        VERIFY_URL: ${{ inputs.verify-url }}
        VERIFY_FIELD: ${{ inputs.verify-field }}
        VERIFY_TIMEOUT: ${{ inputs.verify-timeout }}
        VERIFY_INTERVAL: ${{ inputs.verify-interval }}
        VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/verify-deployment.sh"

    - name: Record installation
      id: installation
      shell: bash
      env:
        ALIAS: ${{ inputs.alias }}
        CUSTOMER_ALIAS: ${{ inputs.customer-alias }}
        ENVIRONMENT: ${{ inputs.environment }}
        VERSION: ${{ inputs.version }}
        TOKEN: ${{ inputs.token }}
        API_BASE: ${{ inputs.api-base }}
        URL: ${{ inputs.url }}
        LOCATION: ${{ inputs.location }}
        VISIBILITY: ${{ inputs.visibility }}
        IS_PRIMARY: ${{ inputs.is-primary }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/add-installation.sh"
