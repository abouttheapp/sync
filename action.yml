name: Report release to AboutTheApp
description: Record app versions, release notes and deployments in AboutTheApp from your release workflow.
author: AboutTheApp

branding:
  icon: upload-cloud
  color: blue

inputs:
  token:
    description: AboutTheApp CI/CD token. Store it as a GitHub Actions secret.
    required: true
  alias:
    description: Product alias in AboutTheApp.
    required: true
  version:
    description: Version string to register, for example 1.2.3 or 26.08.4.
    required: true
  changelog:
    description: Changelog text supplied directly. Cannot be combined with changelog-source other than none.
    required: false
    default: ""
  changelog-source:
    description: Changelog source. Supported values are none, git-log and file.
    required: false
    default: none
  changelog-since:
    description: Git ref used as the start of the changelog range when changelog-source is git-log.
    required: false
    default: ""
  changelog-file:
    description: Keep a Changelog-style file used when changelog-source is file.
    required: false
    default: CHANGELOG.md
  version-visibility:
    description: Version visibility on the public About page. Supported values are public and private. Empty creates a new version as private and keeps an existing version unchanged.
    required: false
    default: ""
  customer-alias:
    description: Customer alias for the installation. Must be supplied together with environment.
    required: false
    default: ""
  environment:
    description: Installation environment, for example production or staging. Must be supplied together with customer-alias.
    required: false
    default: ""
  url:
    description: URL of the installation.
    required: false
    default: ""
  location:
    description: Free-text installation location, for example EU-West Frankfurt.
    required: false
    default: ""
  installation-visibility:
    description: Installation visibility. Supported values are public and private. Empty inherits the previous installation.
    required: false
    default: ""
  is-primary:
    description: Whether this is the primary installation. Supported values are true and false. Empty inherits the previous installation.
    required: false
    default: ""
  verify-url:
    description: URL where the deployed app reports its version. When set, the action waits until the app reports the version and records nothing if it does not.
    required: false
    default: ""
  verify-field:
    description: jq path to the version in a JSON response from verify-url. A non-JSON response is compared by its first line.
    required: false
    default: .version
  verify-timeout:
    description: Seconds to wait for verify-url to report the version.
    required: false
    default: "300"
  verify-interval:
    description: Seconds between checks of verify-url.
    required: false
    default: "10"
  sbom-file:
    description: Path to a CycloneDX JSON SBOM (optionally gzip compressed) to attach to the version, for example one generated by cdxgen, syft or Trivy.
    required: false
    default: ""
  sbom-part:
    description: App part the SBOM describes, for example backend, web or ios. Empty means the whole app. A new SBOM of the same part replaces the previous one.
    required: false
    default: ""
  api-base:
    description: AboutTheApp API base URL.
    required: false
    default: https://aboutthe.app/api/v1

outputs:
  version-id:
    description: Identifier of the registered product version.
    value: ${{ steps.version.outputs.id }}
  installation-id:
    description: Identifier of the recorded installation; empty when no installation was requested.
    value: ${{ steps.installation.outputs.id }}
  sbom-id:
    description: Identifier of the uploaded SBOM; empty when no sbom-file was given.
    value: ${{ steps.sbom.outputs.id }}

runs:
  using: composite
  steps:
    - name: Validate release inputs
      shell: bash
      env:
        CUSTOMER_ALIAS: ${{ inputs.customer-alias }}
        ENVIRONMENT: ${{ inputs.environment }}
        VERSION_VISIBILITY: ${{ inputs.version-visibility }}
        URL: ${{ inputs.url }}
        LOCATION: ${{ inputs.location }}
        VISIBILITY: ${{ inputs.installation-visibility }}
        IS_PRIMARY: ${{ inputs.is-primary }}
        VERIFY_URL: ${{ inputs.verify-url }}
        SBOM_FILE: ${{ inputs.sbom-file }}
        SBOM_PART: ${{ inputs.sbom-part }}
      run: bash "$GITHUB_ACTION_PATH/scripts/validate-report.sh"

    - name: Verify deployed version
      if: ${{ inputs.verify-url != '' }}
      shell: bash
      env:
        VERIFY_URL: ${{ inputs.verify-url }}
        VERIFY_FIELD: ${{ inputs.verify-field }}
        VERIFY_TIMEOUT: ${{ inputs.verify-timeout }}
        VERIFY_INTERVAL: ${{ inputs.verify-interval }}
        VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/scripts/verify-deployment.sh"

    - name: Resolve changelog
      id: changelog
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog }}
        CHANGELOG_SOURCE: ${{ inputs.changelog-source }}
        CHANGELOG_SINCE: ${{ inputs.changelog-since }}
        CHANGELOG_FILE: ${{ inputs.changelog-file }}
        VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/scripts/resolve-changelog.sh"

    - name: Register version
      id: version
      shell: bash
      env:
        ALIAS: ${{ inputs.alias }}
        VERSION: ${{ inputs.version }}
        TOKEN: ${{ inputs.token }}
        API_BASE: ${{ inputs.api-base }}
        CHANGELOG: ${{ steps.changelog.outputs.text }}
        VISIBILITY: ${{ inputs.version-visibility }}
      run: bash "$GITHUB_ACTION_PATH/scripts/add-version.sh"

    - name: Record installation
      id: installation
      if: ${{ inputs.customer-alias != '' && inputs.environment != '' }}
      shell: bash
      env:
        ALIAS: ${{ inputs.alias }}
        CUSTOMER_ALIAS: ${{ inputs.customer-alias }}
        ENVIRONMENT: ${{ inputs.environment }}
        VERSION: ${{ inputs.version }}
        TOKEN: ${{ inputs.token }}
        API_BASE: ${{ inputs.api-base }}
        URL: ${{ inputs.url }}
        LOCATION: ${{ inputs.location }}
        VISIBILITY: ${{ inputs.installation-visibility }}
        IS_PRIMARY: ${{ inputs.is-primary }}
      run: bash "$GITHUB_ACTION_PATH/scripts/add-installation.sh"

    # Last, so a rejected SBOM does not stop a successful deployment from being recorded.
    - name: Upload SBOM
      id: sbom
      if: ${{ inputs.sbom-file != '' }}
      shell: bash
      env:
        ALIAS: ${{ inputs.alias }}
        VERSION: ${{ inputs.version }}
        TOKEN: ${{ inputs.token }}
        API_BASE: ${{ inputs.api-base }}
        SBOM_FILE: ${{ inputs.sbom-file }}
        SBOM_PART: ${{ inputs.sbom-part }}
      run: bash "$GITHUB_ACTION_PATH/scripts/add-sbom.sh"
